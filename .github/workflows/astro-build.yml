name: astro-build

# CI-only build check. Deployment is handled by deploy.yml (GitHub Actions →
# the deploy-workflows reusable → Cloudflare Workers, on push to main).
# This workflow does NOT deploy; it proves the site builds green in a node-only
# environment (no LaTeX), as the deploy runner does: build:figures skips
# gracefully and serves the committed public/figures/ SVGs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tooling/**'
      - 'figures/**'
      - 'public/**'
      - 'citations.bib'
      - 'NOTICE.md'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/astro-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tooling/**'
      - 'NOTICE.md'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git-date-based "last touched" frontmatter
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test tooling
        run: npm run test:tooling
      # No LaTeX install — the deploy runner is node-only, so CI proves the build is
      # green WITHOUT pdflatex/pdftocairo (build:figures serves committed SVGs).
      - name: Build site
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
